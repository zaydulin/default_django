{% if page_obj.has_next %}
<div class="d-flex justify-content-center mt-4">
    <button class="btn btn-outline-primary"
            hx-get="{% url 'blogs:tags_pagination' page_obj.next_page_number %}"
            hx-target="#tags-items"
            hx-swap="beforeend"
            hx-indicator="#loading-indicator">
        Загрузить ещё
    </button>
</div>
{% else %}
<div class="d-flex justify-content-center mt-4">
    <span class="text-muted">Все теги загружены</span>
</div>
{% endif %}
