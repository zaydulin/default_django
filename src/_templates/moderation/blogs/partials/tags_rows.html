{% for tag in tags %}
<tr id="tag-{{ tag.id }}">
    <th scope="row">{{ tag.id }}</th>
    <td style="width: 100px;">
        {% if tag.image %}
            <img src="{{ tag.image.url }}" class="img-thumbnail" alt="{{ tag.name }}" style="max-width: 80px; max-height: 60px;">
        {% else %}
            <span class="text-muted">Нет фото</span>
        {% endif %}
    </td>
    <td>
        <strong class="text-break">{{ tag.name }}</strong>
    </td>
    <td class="text-break" style="max-width: 420px;">{{ tag.description|striptags|truncatewords:20 }}</td>
    <td>
        <button class="btn btn-sm btn-primary"
                hx-get="{% url 'blogs:tags_form' tag.id %}"
                hx-target="#offcanvas-body-content"
                data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasRight">
            <i class="bi bi-pencil"></i>
        </button>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="5" class="text-center text-muted">Нет тегов</td>
</tr>
{% endfor %}
