<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            border-bottom: 3px solid #7367f0;
        }
        .content {
            padding: 30px 20px;
            background-color: #ffffff;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 0 0 8px 8px;
            font-size: 12px;
            color: #6c757d;
            text-align: center;
            border-top: 1px solid #dee2e6;
        }
        .message-box {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .subject {
            color: #7367f0;
            font-size: 20px;
            margin-bottom: 15px;
        }
        hr {
            border: none;
            border-top: 1px solid #dee2e6;
            margin: 20px 0;
        }
        .signature {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    {% if header %}
    <div class="header">
        {{ header|linebreaks }}
    </div>
    {% endif %}

    <div class="content">
        {% if subject %}
        <div class="subject">
            {{ subject }}
        </div>
        {% endif %}

        <div class="message-box">
            {{ message|linebreaks }}
        </div>

        {% if user %}
        <div class="signature">
            С уважением,<br>
            {{ user.get_full_name|default:user.username }}
        </div>
        {% endif %}
    </div>

    {% if footer %}
    <div class="footer">
        {{ footer|linebreaks }}
    </div>
    {% endif %}
</body>
</html>
