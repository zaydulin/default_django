<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Новое сообщение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px 10px 0 0;
        }
        .content {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 0 0 10px 10px;
        }
        .message-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #7367f0;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background: #7367f0;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>📬 Новое сообщение</h2>
    </div>

    <div class="content">
        <p>Здравствуйте, <strong>{{ user.get_full_name|default:user.username }}</strong>!</p>

        <p>Вы получили новое сообщение от <strong>{{ sender.get_full_name|default:sender.username }}</strong>.</p>

        <div class="message-box">
            <h4>{{ message.subject|default:"Без темы" }}</h4>
            <p>{{ message.message|truncatechars:200 }}</p>
        </div>

        <a href="http://{{ request.get_host }}{% url 'mail:message_detail' message.id %}" class="button">
            Прочитать сообщение
        </a>
    </div>
</body>
</html>
